<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Huthunty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #2C1A14; /* بني محروق */
        }

        /* --- الواجهة الأولى (البني المحروق) --- */
        #screen1 {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background-color: #2C1A14;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .start-btn {
            background-color: #ffffff;
            color: #2C1A14;
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:active {
            transform: scale(0.93);
        }

        /* --- الواجهة الثانية (بني محروق + مفرقعات قلوب) --- */
        #screen2 {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background-color: #2C1A14; /* بني محروق مطابق للواجهة الأولى */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #fireworksCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #heart-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* بكسل القلب (بيبي بلو) */
        .pixel-block {
            position: absolute;
            background-color: #89CFF0;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.15), inset 2px 2px 0 rgba(255,255,255,0.6), 0 0 8px rgba(137, 207, 240, 0.5);
            transform: translate(-50%, -50%) scale(0);
            animation: pixelPop 0.15s forwards;
            border-radius: 1px;
        }

        @keyframes pixelPop {
            to { transform: translate(-50%, -50%) scale(1); }
        }

        /* النص داخل القلب (بيبي بلو) */
        #greeting-text {
            position: absolute;
            color: #89CFF0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: 900;
            text-align: center;
            z-index: 20;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 12px rgba(137, 207, 240, 0.8), 0 0 2px #000;
            line-height: 1.3;
            width: 220px;
            pointer-events: none;
        }

        #greeting-text.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div id="screen1">
        <button class="start-btn" id="startBtn">اضغط هنا</button>
    </div>

    <div id="screen2">
        <canvas id="fireworksCanvas"></canvas>
        <div id="heart-container">
            <div id="greeting-text">happy birthday<br>Huthunty</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const heartContainer = document.getElementById('heart-container');
        const greetingText = document.getElementById('greeting-text');
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        startBtn.addEventListener('click', () => {
            screen1.style.opacity = '0';
            screen1.style.visibility = 'hidden';
            
            screen2.style.visibility = 'visible';
            screen2.style.opacity = '1';

            setTimeout(() => {
                startFireworks();
                drawPixelHeart();
            }, 400);
        });

        // 1. رسم القلب البكسل (بيبي بلو)
        function drawPixelHeart() {
            let t = 0;
            const tStep = 0.015;
            const drawnPixels = new Set();

            const isMobile = window.innerWidth < 600;
            const pixelSize = isMobile ? 11 : 16;
            greetingText.style.fontSize = isMobile ? '1.1rem' : '1.5rem';

            function drawFrame() {
                if (t > Math.PI * 2) {
                    setTimeout(() => {
                        greetingText.classList.add('show');
                    }, 200);
                    return;
                }

                for (let i = 0; i < 3; i++) {
                    if (t > Math.PI * 2) break;

                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    const gridX = Math.round(x);
                    const gridY = Math.round(y);
                    const key = `${gridX},${gridY}`;

                    if (!drawnPixels.has(key)) {
                        drawnPixels.add(key);

                        const pixel = document.createElement('div');
                        pixel.className = 'pixel-block';
                        pixel.style.width = pixelSize + 'px';
                        pixel.style.height = pixelSize + 'px';
                        
                        pixel.style.left = (gridX * pixelSize) + 'px';
                        pixel.style.top = (gridY * pixelSize) + 'px';

                        heartContainer.appendChild(pixel);
                    }
                    t += tStep;
                }
                requestAnimationFrame(drawFrame);
            }

            requestAnimationFrame(drawFrame);
        }

        // 2. مفرقعات نارية تتفجر على شكل قلوب
        let particles = [];
        let rockets = [];

        class Rocket {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.45) + (canvas.height * 0.1);
                this.speed = Math.random() * 4 + 7;
                this.color = `hsl(${Math.random() * 360}, 100%, 75%)`;
            }

            update() {
                this.y -= this.speed;
                if (this.y <= this.targetY) {
                    this.explode();
                    return true;
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                const totalPoints = 65; // عدد النقاط لتشكيل هالة القلب
                const baseScale = Math.random() * 0.08 + 0.14; // حجم الانفجار

                for (let i = 0; i < totalPoints; i++) {
                    const t = (i / totalPoints) * Math.PI * 2;
                    
                    // معادلة شكل القلب للمفرقعات
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    // حساب اتجاه وسرعة انطلاق الشرارة لتكوين رسمة القلب
                    const vx = hx * baseScale;
                    const vy = hy * baseScale;

                    particles.push(new HeartParticle(this.x, this.y, vx, vy, this.color));
                }
            }
        }

        class HeartParticle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.gravity = 0.035; // جاذبية خفيفة للحفاظ على شكل القلب أثناء الهبوط
                this.friction = 0.965;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.008;
                this.size = Math.random() * 2.5 + 1.5;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function startFireworks() {
            function loop() {
                // تنظيف الشاشة مع الحفاظ على اللون البني المحروق (#2C1A14 -> rgb(44, 26, 20))
                ctx.fillStyle = 'rgba(44, 26, 20, 0.22)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (Math.random() < 0.07) {
                    rockets.push(new Rocket());
                }

                for (let i = rockets.length - 1; i >= 0; i--) {
                    rockets[i].draw();
                    if (rockets[i].update()) {
                        rockets.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
